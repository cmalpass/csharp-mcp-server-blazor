name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Restore .NET dependencies
      run: dotnet restore McpServerApp/McpServerApp.sln

    - name: Build Solution
      run: dotnet build McpServerApp/McpServerApp.sln --no-restore --configuration Release

    - name: Run .NET Test Suite
      run: dotnet test McpServerApp/McpServerApp.sln --no-build --configuration Release --verbosity normal

    - name: Install Playwright & Chromium
      run: |
        npm ci
        npx playwright install --with-deps chromium

    - name: Run Playwright Browser Tests
      run: npm run test:e2e

    - name: Upload Test Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          playwright-report/
          docs/evidence/
